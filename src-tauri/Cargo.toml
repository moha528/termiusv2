[package]
name = "termiusv2"
version = "0.1.0"
description = "Client SSH/SFTP desktop libre — alternative à Termius"
authors = ["Termius v2 contributors"]
edition = "2021"

[lib]
name = "termiusv2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
