[package]
name = "lynk"
version = "1.0.5"
description = "Client SSH/SFTP desktop libre — local-first, chiffré, sans cloud"
authors = ["Lynk Client contributors"]
edition = "2021"
license = "FSL-1.1-MIT"

[lib]
name = "lynk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Auto-update (P5-T06). `process` permet le relaunch après installation.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }

# Types partagés front/back
ts-rs = { version = "10", features = ["serde-compat", "uuid-impl", "chrono-impl"] }

# SSH — `ring` backend evite la chaine NASM/AWS-LC sur Windows ; aucune perte
# fonctionnelle pour notre scope.
russh = { version = "0.61", default-features = false, features = ["ring"] }
russh-sftp = "2"

# Local PTY (Windows ConPTY / macOS-Linux openpty) pour l'onglet "Local"
portable-pty = "0.9"

# SSH key generation / parsing (RustCrypto). Ed25519 par défaut ; RSA via le
# crate rsa pour pouvoir choisir 4096 bits (ssh-key::random force 3072).
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "rand_core"] }
rsa = { version = "0.9", features = ["sha2"] }
rand_core = { version = "0.6", features = ["std"] }

# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Hash de mot de passe maître (P3-T07). Argon2id par défaut, paramètres
# standards (m=19MB, t=2, p=1) qui se vérifient en ~50 ms.
argon2 = "0.5"

# Export/import chiffré du vault (P5-T01). AES-256-GCM authentifié, clé
# dérivée du password via Argon2id avec un sel embarqué dans le fichier.
aes-gcm = "0.10"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native window styling (Mica/Acrylic) — Windows + macOS
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
